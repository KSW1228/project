---
# web 그룹 전용 변수
# RAID1 + LVM 변수 (common/raid_lvm.yaml 이 사용)
md_name: md0
vg_name: vg_web
lv_name: lv_www
mount_point: /var/www/html

# ===========================================================
#  WordPress "완전 자동" 설치 변수 (web/web_install.yaml 이 사용)
#  ★ 브라우저 설치 마법사 없이 admin/1234 까지 자동
#  ★ DB 는 db_install.yaml 에서 이미 만든 ksw_db / kswuser_db 를 원격 사용
# ===========================================================
wp_path: /var/www/html/wordpress           # ko zip 은 wordpress/ 하위로 풀림
wp_download_url: https://ko.wordpress.org/latest-ko_KR.zip

# ── DB 연결 (마법사 1단계 대체) — db.ksw.io(20번)의 ksw_db ──
wp_db_host: db.ksw.io
wp_db_name: ksw_db
wp_db_user: kswuser_db
wp_db_pass: "1234"
wp_db_prefix: wp_

# ── 사이트 + 관리자 (마법사 2단계 대체) ──
#   www.ksw.io 로 접속하면 이 사이트가 뜨고, admin/1234 로 로그인
wp_url: http://www.ksw.io/wordpress
wp_title: "KSW WordPress"
wp_admin_user: admin
wp_admin_pass: "1234"
wp_admin_email: admin@ksw.io
